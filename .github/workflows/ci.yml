name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 22 }
          - { os: macos-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Test with coverage
        run: npm run coverage
      - name: Build
        run: npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: CLI smoke test (dev → CRUD → admin → record → replay)
        run: |
          node dist/bin.js --version
          mkdir smoke && cd smoke
          node ../dist/bin.js init
          node ../dist/bin.js dev --port 3123 --no-dashboard &
          SERVER_PID=$!
          sleep 2
          curl -sf http://127.0.0.1:3123/users | grep -q "Ada"
          curl -sf -X POST http://127.0.0.1:3123/__mocktape__/reset > /dev/null
          curl -sf http://127.0.0.1:3123/__mocktape__/health | grep -q '"ok":true'
          kill $SERVER_PID
          echo "smoke test passed"
