name: 🐛 Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description, including what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      placeholder: |
        mocktape.json (or CLI invocation) + the failing request:
        $ curl -i http://localhost:3000/...
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: Which command?
      options:
        - "dev"
        - "record"
        - "replay"
        - "library API (createMocktape)"
        - other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mocktape version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v22.10.0"
    validations:
      required: true
